[project]
name = "tarea-4-agente-socioeconomico"
version = "0.1.0"
description = "Tarea 4: agente de investigación socioeconómica con un MCP del BCRP y Skills de la ENAHO 2024"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "httpx",
    "matplotlib>=3.11.2",
    "pandas",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
