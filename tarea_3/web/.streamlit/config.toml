[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141413"
textColor = "#f0efec"
primaryColor = "#c3c2b7"
linkColor = "#9ec5f4"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#0d0d0d"
showSidebarBorder = true
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#141413"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
